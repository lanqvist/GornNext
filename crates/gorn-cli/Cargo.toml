[package]
name = "gorn-cli"
description = "Самоигра, замеры и сверка тюрьмы с эталоном на TS"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
gorn-prison.workspace = true
gorn-core.workspace = true
indexmap = "2"
chrono = "0.4"
rusqlite = "0.32"
rayon.workspace = true
serde_json.workspace = true
png = "0.17"
# OCR Windows для экзамена — тот же модуль, что у приложения (app/src/ocr.rs).
gorn-vorax-scan.workspace = true
windows = { version = "0.62", features = ["Win32_System_WinRT", "Foundation", "Globalization", "Graphics_Imaging", "Media_Ocr", "Storage_Streams"] }
