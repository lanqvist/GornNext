[package]
name = "gorn-app"
description = "Горн на Tauri 2: трекер валюты и подсказки в тюрьме"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "gorn"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
gorn-prison.workspace = true
gorn-core.workspace = true
rayon.workspace = true
serde_json.workspace = true
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
ureq = "2"
windows-capture = "2"
windows = { version = "0.62", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_Globalization"] }
regex = "1"
chrono = "0.4"
png = "0.17"
